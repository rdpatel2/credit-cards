[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "card-compass"
version = "0.1.0"
description = "Personal finance desktop workspace with budgeting, investments, and credit cards"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7", "scipy>=1.13,<2", "PyMuPDF>=1.24,<2", "exchange-calendars>=4.11,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
finance-compass = "card_compass.app:main"
card-compass = "card_compass.app:main"

[tool.setuptools.package-data]
card_compass = ["data/*.json"]

[tool.setuptools.packages.find]
include = ["card_compass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

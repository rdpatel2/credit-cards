name: Desktop validation and builds
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller --noconfirm FinanceCompass.spec
      - name: Smoke test packaged app
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            dist/FinanceCompass/FinanceCompass.exe --smoke-test
          else
            dist/FinanceCompass/FinanceCompass --smoke-test
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FinanceCompass-${{ matrix.os }}
          path: dist/FinanceCompass*
